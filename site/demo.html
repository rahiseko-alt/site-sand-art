<!DOCTYPE html>
<html lang="ja" class="bg-black">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>スジャータ (Sujata) — 混ぜるたびに違う文字へ収束する</title>
  <style>
    @font-face {
      font-family: 'SF Pro';
      src: url('./font/SF-Pro-Subset.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Pretendard';
      src: url('./font/PretendardVariable.woff2') format('woff2-variations');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'SF Pro', 'Pretendard', -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #bgLayer {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-color: #000000;
      transition: background-color 1.1s cubic-bezier(0.25, 1, 0.5, 1);
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 30;
      pointer-events: none;
    }

    #particleOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      touch-action: none;
      cursor: crosshair;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 68px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 40;
      pointer-events: none;
      color: #ffffff;
      transition: color 0.8s ease;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      opacity: 0.8;
    }
    .stage-badge {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }

    .bottom-hint {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 40;
      text-align: center;
      color: #ffffff;
      transition: color 0.8s ease;
      pointer-events: none;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      opacity: 0.65;
      width: 90%;
    }
  </style>
  <script src="./three.min.js"></script>
  <script src="./sujata-paths.js"></script>
</head>
<body>
  <div id="bgLayer"></div>
  <canvas id="canvas"></canvas>
  <div id="particleOverlay"></div>

  <header id="uiHeader">
    <div class="brand-title">SUNAGA GURUGURU</div>
    <div class="stage-badge" id="stageBadge">01 / 06</div>
  </header>

  <div class="bottom-hint" id="bottomHint">
    指やマウスで文字を触って混ぜる（スジャータする）たびに、混ざった砂が「次の違う文字」になって浮かび上がります
  </div>

  <script>
    const aa = 661, as = 695;

    function drawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    /**
     * All stages that emerge one after another every time you mix (Sujata) the sand!
     */
    const STAGE_PALETTES = [
      // 01: Aurora Cyan -> Electric Violet -> Champagne Gold
      [[0.22, 0.92, 1.0], [0.58, 0.45, 1.0], [1.0, 0.82, 0.42]],
      // 02: Sunset Coral -> Warm Gold -> Mint Cyan
      [[1.0, 0.46, 0.36], [1.0, 0.84, 0.44], [0.30, 0.94, 0.84]],
      // 03 (light bg): Deep Indigo -> Crimson Rose -> Emerald
      [[0.12, 0.22, 0.62], [0.76, 0.14, 0.34], [0.06, 0.48, 0.38]],
      // 04: Ruby Rose -> Amber Gold -> Sky Pearl
      [[0.98, 0.42, 0.56], [1.0, 0.78, 0.36], [0.68, 0.88, 1.0]],
      // 05 (light bg): Royal Navy -> Terracotta -> Forest Teal
      [[0.14, 0.20, 0.48], [0.72, 0.28, 0.16], [0.08, 0.42, 0.36]],
      // 06: Emerald -> Sky Blue -> Magenta Rose
      [[0.26, 0.96, 0.72], [0.36, 0.72, 1.0], [0.98, 0.44, 0.82]]
    ];

    const STAGES = [
      {
        name: "01",
        bg: "#000000",
        uiColor: "#ffffff",
        particleRGB: [1.0, 1.0, 1.0],
        draw(ctx, w, h) {
          const isMobile = w < 1024;
          const s = isMobile ? 0.8 : 0.6;
          const o = Math.min((w * s) / aa, (h * s) / as);
          const l = w / 2 - 330.5 * o;
          const topY = h / 2 - 347.5 * o;
          ctx.save();
          ctx.translate(l, topY);
          ctx.scale(o, o);
          const paths = window.ORIGINAL_HERO_PATHS || [];
          for (let i = 0; i < paths.length; i++) {
            ctx.fill(new Path2D(paths[i]));
          }
          ctx.restore();
        }
      },
      {
        name: "02",
        bg: "#000000",
        uiColor: "#ffffff",
        particleRGB: [1.0, 0.94, 0.84],
        draw(ctx, w, h) {
          const isMobile = w <= 768;
          const logoW = isMobile ? 220 : 420;
          const scale = logoW / 138;
          const logoH = 33 * scale;
          ctx.save();
          ctx.translate((w - logoW) / 2, h * 0.38 - logoH / 2);
          ctx.scale(scale, scale);
          const paths = window.ORIGINAL_TEXT_PATHS || [];
          for (let i = 0; i < paths.length; i++) {
            ctx.fill(new Path2D(paths[i]));
          }
          ctx.restore();

          const fs = isMobile ? 28 : 48;
          ctx.font = `900 ${fs}px "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("混ぜる、新しくなる。", w / 2, h * 0.56);
        }
      },
      {
        name: "03",
        bg: "#f5f5f5",
        uiColor: "#1a1a1a",
        particleRGB: [0.08, 0.08, 0.08],
        draw(ctx, w, h) {
          const isMobile = w < 768;
          const fs1 = isMobile ? Math.min(w * 0.17, 64) : Math.min(w * 0.1, 118);
          ctx.font = `900 ${Math.round(fs1)}px "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("砂がぐるぐる", w / 2, h * 0.42);

          const fs2 = Math.round(fs1 * 0.40);
          ctx.font = `800 ${fs2}px "SF Pro", sans-serif`;
          ctx.fillText("NOTHING IS NEW", w / 2, h * 0.57);
        }
      },
      {
        name: "04",
        bg: "#0e0c0a",
        uiColor: "#f5e6d3",
        particleRGB: [0.95, 0.87, 0.75],
        getButtons(w, h) {
          const isMobile = w < 768;
          const cardW = isMobile ? Math.min(w * 0.82, 300) : 380;
          const cardH = isMobile ? 380 : 460;
          const x = (w - cardW) / 2;
          const y = h * 0.48 - cardH / 2;
          return [{ x, y, w: cardW, h: cardH, url: "./mix.html", label: "ORIGINAL MIX" }];
        },
        draw(ctx, w, h) {
          const isMobile = w < 768;
          const b = this.getButtons(w, h)[0];
          const { x, y, w: cardW, h: cardH } = b;

          ctx.lineWidth = isMobile ? 10 : 14;
          ctx.strokeStyle = "#fff";
          drawRoundRect(ctx, x, y, cardW, cardH, 24);
          ctx.stroke();

          ctx.fillRect(x, y, cardW, cardH * 0.22);
          ctx.save();
          ctx.globalCompositeOperation = "destination-out";
          ctx.font = `900 ${isMobile ? 20 : 26}px "SF Pro", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("PRODUCT CARD", w / 2, y + cardH * 0.11);
          ctx.restore();

          ctx.beginPath();
          ctx.arc(w / 2, y + cardH * 0.52, cardW * 0.19, 0, Math.PI * 2);
          ctx.fill();

          ctx.font = `900 ${isMobile ? 24 : 32}px "SF Pro", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("ORIGINAL MIX", w / 2, y + cardH * 0.84);
        }
      },
      {
        name: "05",
        bg: "#f2efe9",
        uiColor: "#181512",
        particleRGB: [0.12, 0.09, 0.07],
        getButtons(w, h) {
          const isMobile = w < 768;
          const urls = ["./coffee.html", "./culture.html", "./rituals.html"];
          const titles = ["COFFEE", "CULTURE", "RITUALS"];
          const nums = ["01", "02", "03"];
          const buttons = [];
          if (isMobile) {
            const cw = Math.min(w * 0.84, 310);
            const ch = 92;
            const gap = 20;
            const startY = h * 0.48 - (ch * 3 + gap * 2) / 2;
            const cx = (w - cw) / 2;
            for (let i = 0; i < 3; i++) {
              buttons.push({ x: cx, y: startY + i * (ch + gap), w: cw, h: ch, url: urls[i], num: nums[i], title: titles[i] });
            }
          } else {
            const cw = Math.min((w * 0.8) / 3, 260);
            const ch = cw * 1.35;
            const gap = 30;
            const totalW = cw * 3 + gap * 2;
            const startX = (w - totalW) / 2;
            const cy = h * 0.48 - ch / 2;
            for (let i = 0; i < 3; i++) {
              buttons.push({ x: startX + i * (cw + gap), y: cy, w: cw, h: ch, url: urls[i], num: nums[i], title: titles[i] });
            }
          }
          return buttons;
        },
        draw(ctx, w, h) {
          const isMobile = w < 768;
          const buttons = this.getButtons(w, h);
          for (let i = 0; i < buttons.length; i++) {
            const b = buttons[i];
            if (isMobile) {
              ctx.lineWidth = 8;
              ctx.strokeStyle = "#fff";
              drawRoundRect(ctx, b.x, b.y, b.w, b.h, 16);
              ctx.stroke();
              ctx.font = `900 25px "SF Pro", sans-serif`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(`${b.num}  ${b.title}`, b.x + b.w / 2, b.y + b.h / 2);
            } else {
              ctx.lineWidth = 10;
              ctx.strokeStyle = "#fff";
              drawRoundRect(ctx, b.x, b.y, b.w, b.h, 20);
              ctx.stroke();
              ctx.font = `900 42px "SF Pro", sans-serif`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(b.num, b.x + b.w / 2, b.y + b.h * 0.36);
              ctx.font = `800 26px "SF Pro", sans-serif`;
              ctx.fillText(b.title, b.x + b.w / 2, b.y + b.h * 0.72);
            }
          }
        }
      },
      {
        name: "06",
        bg: "#000000",
        uiColor: "#ffffff",
        particleRGB: [1.0, 1.0, 1.0],
        draw(ctx, w, h) {
          const isMobile = w < 768;
          const fs = isMobile ? Math.min(w * 0.14, 52) : Math.min(w * 0.08, 92);
          ctx.font = `900 ${Math.round(fs)}px "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("既知から、", w / 2, h * 0.39);
          ctx.fillText("未知は始まる。", w / 2, h * 0.55);
        }
      }
    ];

    class FluidCell {
      constructor(x, y, r) {
        this.x = x;
        this.y = y;
        this.r = r;
        this.xv = 0;
        this.yv = 0;
        this.pressure = 0;
        this.up = this.down = this.left = this.right = null;
        this.up_left = this.up_right = this.down_left = this.down_right = null;
      }
    }

    class SujataParticle {
      constructor(x, y) {
        this.x = this.px = this.ox = x;
        this.y = this.py = this.oy = y;
        this.xv = 0;
        this.yv = 0;
        this.returnStartAt = null;
      }
    }

    const canvas = document.getElementById('canvas');
    const overlay = document.getElementById('particleOverlay');
    const bgLayer = document.getElementById('bgLayer');
    const uiHeader = document.getElementById('uiHeader');
    const bottomHint = document.getElementById('bottomHint');
    const stageBadge = document.getElementById('stageBadge');

    let viewWidth = window.innerWidth;
    let viewHeight = window.innerHeight;
    let numCols = 0;
    let numRows = 0;
    let af = [];
    let au = [];
    let posArray = null;
    let colArray = null;

    let renderer, scene, camera, geometry, material, pointsMesh;
    const PARTICLE_COUNT = window.innerWidth <= 1024 ? 75000 : 120000;

    let currentStage = 0;
    let precomputedStageTargets = []; // Pre-sampled target points for each stage so switching is zero-lag!

    let colorCurrent = [1, 1, 1];
    let colorTarget = [1, 1, 1];

    const aV = { x: -9999, y: -9999, px: -9999, py: -9999 };
    const aG = { targetX: 0, targetY: 0, currentX: 0, currentY: 0 };
    const aw = { lastAt: 0 };
    let ak = performance.now() * 0.001;

    // Track how much the user has mixed (Sujata'd) the current shape!
    let mixDistanceAccum = 0;
    let hasSwitchedForCurrentMix = false;
    let lastStageSwitchAt = 0;

    const aX = new THREE.Matrix4();
    const aY = new THREE.Matrix4();
    const aj = new THREE.Matrix4();
    const aq = new THREE.Euler();
    const aK = new THREE.Matrix4().makeScale(1, -1, 1);

    function initFluidGrid() {
      numCols = Math.ceil(viewWidth / 10);
      numRows = Math.ceil(viewHeight / 10);
      af = [];
      for (let c = 0; c < numCols; c++) {
        af[c] = [];
        for (let r = 0; r < numRows; r++) {
          af[c][r] = new FluidCell(10 * c, 10 * r, 10);
        }
      }
      for (let c = 0; c < numCols; c++) {
        for (let r = 0; r < numRows; r++) {
          const cell = af[c][r];
          const up = r - 1, down = r + 1, left = c - 1, right = c + 1;
          cell.up = up >= 0 ? af[c][up] : null;
          cell.down = down < numRows ? af[c][down] : null;
          cell.left = left >= 0 ? af[left][r] : null;
          cell.right = right < numCols ? af[right][r] : null;
          cell.up_left = (up >= 0 && left >= 0) ? af[left][up] : null;
          cell.up_right = (up >= 0 && right < numCols) ? af[right][up] : null;
          cell.down_left = (down < numRows && left >= 0) ? af[left][down] : null;
          cell.down_right = (down < numRows && right < numCols) ? af[right][down] : null;
        }
      }
    }

    function sampleStagePoints(stageIdx) {
      const stage = STAGES[stageIdx];
      const isMobile = viewWidth < 1024;
      const superSample = isMobile ? 1.25 : 1.15;
      const rw = Math.floor(viewWidth * superSample);
      const rh = Math.floor(viewHeight * superSample);

      const off = document.createElement('canvas');
      off.width = rw;
      off.height = rh;
      const ctx = off.getContext('2d', { willReadFrequently: true });

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, rw, rh);
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#fff';

      ctx.save();
      ctx.scale(superSample, superSample);
      stage.draw(ctx, viewWidth, viewHeight);
      ctx.restore();

      const img = ctx.getImageData(0, 0, rw, rh).data;
      const rawPts = [];
      const step = isMobile ? 1 : 2;
      for (let y = 0; y < rh; y += step) {
        for (let x = 0; x < rw; x += step) {
          if (img[(y * rw + x) * 4] > 128) {
            rawPts.push({
              x: (x + (Math.random() - 0.5) * step) / superSample,
              y: (y + (Math.random() - 0.5) * step) / superSample
            });
          }
        }
      }

      if (rawPts.length === 0) {
        rawPts.push({ x: viewWidth / 2, y: viewHeight / 2 });
      }

      // Sort spatially so adjacent particles map cleanly
      rawPts.sort((a, b) => (a.x - b.x) || (a.y - b.y));
      return rawPts;
    }

    function precomputeAllStages() {
      precomputedStageTargets = STAGES.map((_, idx) => sampleStagePoints(idx));
    }

    function getHitButton(x, y) {
      const st = STAGES[currentStage];
      if (!st || !st.getButtons) return null;
      const btns = st.getButtons(viewWidth, viewHeight);
      for (let i = 0; i < btns.length; i++) {
        const b = btns[i];
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
      }
      return null;
    }

    const DEFAULT_HINT = '指やマウスで文字を触って混ぜる（スジャータする）たびに、混ざった砂が「次の違う文字」になって浮かび上がります';
    const CARD_HINT = 'カードをクリック／タップで別ページへ移動します（ドラッグで混ぜると次の形へ）';

    let targetColorArray = null;
    let particleShade = null;
    let colorTransitionFrames = 0;

    function samplePaletteColor(palette, u, shade) {
      const t = Math.min(0.9999, Math.max(0, u)) * (palette.length - 1);
      const idx = t | 0;
      const frac = t - idx;
      const c0 = palette[idx], c1 = palette[idx + 1];
      return [
        Math.min(1, (c0[0] + (c1[0] - c0[0]) * frac) * shade),
        Math.min(1, (c0[1] + (c1[1] - c0[1]) * frac) * shade),
        Math.min(1, (c0[2] + (c1[2] - c0[2]) * frac) * shade)
      ];
    }

    function assignStageColors(stageIdx, immediate) {
      if (!targetColorArray || !au.length) return;
      const palette = STAGE_PALETTES[stageIdx % STAGE_PALETTES.length];
      const w = viewWidth || 1, h = viewHeight || 1;
      for (let i = 0; i < au.length; i++) {
        const p = au[i];
        // Map gradient across central glyph area so full multi-color palette shines
        const nx = Math.min(1, Math.max(0, (p.ox / w - 0.28) / 0.44));
        const ny = Math.min(1, Math.max(0, (p.oy / h - 0.28) / 0.44));
        const u = 0.72 * nx + 0.28 * ny;
        const [r, g, b] = samplePaletteColor(palette, u, particleShade[i]);
        targetColorArray[3 * i] = r;
        targetColorArray[3 * i + 1] = g;
        targetColorArray[3 * i + 2] = b;
        if (immediate) {
          colArray[3 * i] = r;
          colArray[3 * i + 1] = g;
          colArray[3 * i + 2] = b;
        }
      }
      if (immediate && geometry) {
        geometry.attributes.color.needsUpdate = true;
      } else {
        colorTransitionFrames = 110;
      }
    }

    function updateStageUI(stageIdx) {
      const st = STAGES[stageIdx];
      bgLayer.style.backgroundColor = st.bg;
      uiHeader.style.color = st.uiColor;
      bottomHint.style.color = st.uiColor;
      bottomHint.textContent = st.getButtons ? CARD_HINT : DEFAULT_HINT;
      stageBadge.textContent = `0${stageIdx + 1} / 0${STAGES.length}`;
      colorTarget = [...st.particleRGB];
      if (!st.getButtons) overlay.style.cursor = 'crosshair';
    }

    /**
     * THE CORE IDEA:
     * When the user touches/drags to mix the sand (Sujata), instead of returning to the OLD shape's (ox, oy),
     * we silently update (ox, oy) to the NEXT stage's shape AND inject a full-shape Sujata fluid swirl!
     * That way, the exact same authentic fluid mixing physics naturally settles into the NEW text/shape!
     */
    function advanceHomeTargetsToNextStage(touchX, touchY, vx, vy) {
      const now = performance.now();
      if (now - lastStageSwitchAt < 1100) return;
      lastStageSwitchAt = now;

      currentStage = (currentStage + 1) % STAGES.length;
      updateStageUI(currentStage);

      const targetPts = precomputedStageTargets[currentStage];
      const tLen = targetPts.length;
      const pLen = au.length;

      // Sort particles by their current live position so they flow to the nearest part of the new text
      const sortedIndices = au.map((_, idx) => idx).sort((i, j) => {
        return (au[i].x - au[j].x) || (au[i].y - au[j].y);
      });

      for (let k = 0; k < pLen; k++) {
        const p = au[sortedIndices[k]];
        const pt = targetPts[Math.floor((k * tLen) / pLen)];
        p.ox = pt.x + (Math.random() - 0.5) * 0.9;
        p.oy = pt.y + (Math.random() - 0.5) * 0.9;
        // Reset returnStartAt so the particle swirls freely in the fluid before settling into its NEW (ox, oy)!
        p.returnStartAt = null;
      }
      assignStageColors(currentStage, false);

      // Also propagate the user's mixing swirl across the rest of the text so the whole word swirls & reforms together!
      const cx = viewWidth / 2;
      const cy = viewHeight * 0.45;
      const spinDir = (vx * (touchY - cy) - vy * (touchX - cx)) >= 0 ? 1 : -1;
      const radius = Math.min(viewWidth, viewHeight) * 0.42;

      for (let c = 0; c < numCols; c++) {
        const col = af[c];
        for (let r = 0; r < numRows; r++) {
          const cell = col[r];
          const dx = cell.x - cx;
          const dy = cell.y - cy;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist < radius) {
            const factor = Math.sin((dist / radius) * Math.PI);
            // Strong swirling vortex + strong outward radial burst
            const swirlSpeed = factor * 160 * spinDir;
            const radialSpeed = factor * 55;
            cell.xv += (-dy / dist) * swirlSpeed + (dx / dist) * radialSpeed + vx * factor * 0.7875;
            cell.yv += (dx / dist) * swirlSpeed + (dy / dist) * radialSpeed + vy * factor * 0.7875;
          }
        }
      }
    }

    function initThreeEngine() {
      viewWidth = window.innerWidth;
      viewHeight = window.innerHeight;

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(viewWidth, viewHeight, false);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 0);

      scene = new THREE.Scene();
      const v = viewHeight;
      const fov = 2 * Math.atan((viewHeight / 2) / v) * (180 / Math.PI);
      camera = new THREE.PerspectiveCamera(fov, viewWidth / viewHeight, 0.1, 3 * v);
      camera.position.set(viewWidth / 2, viewHeight / 2, v);
      camera.lookAt(viewWidth / 2, viewHeight / 2, 0);

      initFluidGrid();
      precomputeAllStages();

      const initialPts = precomputedStageTargets[0];
      const tLen = initialPts.length;
      au = [];
      posArray = new Float32Array(3 * PARTICLE_COUNT);
      colArray = new Float32Array(3 * PARTICLE_COUNT);
      targetColorArray = new Float32Array(3 * PARTICLE_COUNT);
      particleShade = new Float32Array(PARTICLE_COUNT);

      const initRGB = STAGES[0].particleRGB;
      colorCurrent = [...initRGB];
      colorTarget = [...initRGB];

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const pt = initialPts[Math.floor((i * tLen) / PARTICLE_COUNT)];
        const px = pt.x + (Math.random() - 0.5) * 0.9;
        const py = pt.y + (Math.random() - 0.5) * 0.9;
        const p = new SujataParticle(px, py);
        au.push(p);
        particleShade[i] = 0.80 + Math.random() * 0.40;

        posArray[3 * i] = px;
        posArray[3 * i + 1] = py;
        posArray[3 * i + 2] = 0;
      }

      geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
      assignStageColors(0, true);

      const ptSize = (window.innerWidth <= 1024 ? 0.55 : 0.8) * Math.min(window.devicePixelRatio || 1, 2);
      material = new THREE.PointsMaterial({
        size: ptSize,
        sizeAttenuation: false,
        transparent: true,
        depthWrite: false,
        vertexColors: true
      });

      pointsMesh = new THREE.Points(geometry, material);
      pointsMesh.matrixAutoUpdate = false;
      pointsMesh.frustumCulled = false;
      scene.add(pointsMesh);
    }

    const aR = (e) => (e ? e.xv : 0);
    const aP = (e) => (e ? e.yv : 0);
    const aU = (e) => (e ? e.pressure : 0);

    // Fixed physics timestep: every per-step constant (0.99 / 0.4 / 0.09 / spring) was tuned at 60fps.
    // Running the physics in fixed 1/60s steps keeps the spring gain (93.75 * STEP = 1.5625) constant,
    // far below the explicit-integration divergence limit (2.8), even when a frame takes longer.
    const PHYSICS_STEP = 1 / 60;
    // Max 1 step per frame: one 140k-particle step costs close to a full frame, so catch-up steps
    // made frames longer -> more steps -> spiral (measured 17.6ms -> 59.7ms median). On slow frames
    // the sim runs slightly slower instead of diverging.
    const MAX_PHYSICS_STEPS = 1;
    let physicsAcc = 0;
    let simT = ak;

    // 100% Authentic Original Fluid Physics + Return Spring Loop from 044nib_tuote3.js!
    function renderLoop() {
      const t = performance.now() * 0.001;
      const frameDt = Math.min(0.1, Math.max(0, t - ak));
      ak = t;

      // 1. 3D Tilt matrix update (exact math from 044nib_tuote3.js)
      aG.currentX += (aG.targetX - aG.currentX) * 0.08;
      aG.currentY += (aG.targetY - aG.currentY) * 0.08;
      if (pointsMesh) {
        const maxRad = (Math.PI / 180) * 8;
        const rx = aG.currentY * maxRad;
        const ry = aG.currentX * maxRad;
        const cx = viewWidth / 2;
        const cy = viewHeight / 2;
        aX.makeTranslation(-cx, -cy, 0);
        aY.makeTranslation(cx, cy, 0);
        aq.set(rx, ry, 0);
        aj.makeRotationFromEuler(aq);
        pointsMesh.matrix.identity().multiply(aY).multiply(aj).multiply(aK).multiply(aX);
        pointsMesh.matrixWorldNeedsUpdate = true;
      }

      // 2. Pointer velocity injection into 10px fluid grid (exact math from 044nib_tuote3.js)
      const dxPointer = aV.x - aV.px;
      const dyPointer = aV.y - aV.py;
      const moveDist = Math.hypot(dxPointer, dyPointer);
      if (moveDist > 0) {
        const steps = Math.max(1, Math.ceil(moveDist / 6));
        for (let s = 0; s <= steps; s++) {
          const ratio = s / steps;
          const ix = aV.px + dxPointer * ratio;
          const iy = aV.py + dyPointer * ratio;

          const minC = Math.max(0, ((ix - 48) / 10) | 0);
          const maxC = Math.min(numCols - 1, ((ix + 48) / 10) | 0);
          const minR = Math.max(0, ((iy - 48) / 10) | 0);
          const maxR = Math.min(numRows - 1, ((iy + 48) / 10) | 0);

          for (let c = minC; c <= maxC; c++) {
            const col = af[c];
            for (let r = minR; r <= maxR; r++) {
              const cell = col[r];
              const d = Math.hypot(cell.x - ix, cell.y - iy);
              if (d < 48) {
                const safeD = d < 4 ? 48 : d;
                const falloff = 48 / safeD;
                cell.xv += dxPointer * falloff * 2.25;
                cell.yv += dyPointer * falloff * 2.25;
              }
            }
          }
        }
        aw.lastAt = t;

        // Accumulate mixing distance; once the user has stirred/mixed the text by ~90px,
        // switch the home targets (ox, oy) to the NEXT stage so the swirling sand settles into the new text!
        mixDistanceAccum += moveDist;
        if (!hasSwitchedForCurrentMix && mixDistanceAccum > 90) {
          hasSwitchedForCurrentMix = true;
          advanceHomeTargetsToNextStage(aV.x, aV.y, dxPointer, dyPointer);
        }
      }

      // Reset mix accumulator after pointer stops moving for 0.6s so the next stir triggers the next text!
      if (t - aw.lastAt > 0.55) {
        mixDistanceAccum = 0;
        hasSwitchedForCurrentMix = false;
      }

      // 3. Smooth per-particle gradient color interpolation when stage changes
      if (colorTransitionFrames > 0) {
        colorTransitionFrames--;
        const len3 = au.length * 3;
        for (let j = 0; j < len3; j++) {
          colArray[j] += (targetColorArray[j] - colArray[j]) * 0.08;
        }
        geometry.attributes.color.needsUpdate = true;
      }

      // 4-6. Physics in fixed 1/60s steps (pointer injection above stays per-frame, as before)
      physicsAcc += frameDt;
      let physicsSteps = 0;
      // Round to the nearest step count (threshold = half a step) so ordinary ~16.6ms vsync frames
      // always get exactly one step instead of alternating 0/2 steps due to timer noise.
      while (physicsAcc >= PHYSICS_STEP * 0.5 && physicsSteps < MAX_PHYSICS_STEPS) {
      physicsAcc -= PHYSICS_STEP;
      physicsSteps++;
      simT += PHYSICS_STEP;

      // 4. Exact 10px Fluid Grid Simulation from 044nib_tuote3.js
      const waveN = 0.06 * simT;
      for (let c = 0; c < af.length; c++) {
        const col = af[c];
        for (let r = 0; r < col.length; r++) {
          const cell = col[r];
          cell.xv += 0.005 * Math.sin(0.005 * cell.y + waveN);
          cell.yv += 0.005 * Math.cos(0.005 * cell.x - 1.1 * waveN);
        }
      }

      for (let c = 0; c < af.length; c++) {
        const col = af[c];
        for (let r = 0; r < col.length; r++) {
          const e = col[r];
          const px = 0.5 * aR(e.up_left) + aR(e.left) + 0.5 * aR(e.down_left) - 0.5 * aR(e.up_right) - aR(e.right) - 0.5 * aR(e.down_right);
          const py = 0.5 * aP(e.up_left) + aP(e.up) + 0.5 * aP(e.up_right) - 0.5 * aP(e.down_left) - aP(e.down) - 0.5 * aP(e.down_right);
          e.pressure = (px + py) * 0.25;
        }
      }

      for (let c = 0; c < af.length; c++) {
        const col = af[c];
        for (let r = 0; r < col.length; r++) {
          const e = col[r];
          e.xv += (0.5 * aU(e.up_left) + aU(e.left) + 0.5 * aU(e.down_left) - 0.5 * aU(e.up_right) - aU(e.right) - 0.5 * aU(e.down_right)) * 0.25;
          e.yv += (0.5 * aU(e.up_left) + aU(e.up) + 0.5 * aU(e.up_right) - 0.5 * aU(e.down_left) - aU(e.down) - 0.5 * aU(e.down_right)) * 0.25;
          const mag = Math.hypot(e.xv, e.yv);
          if (mag > 280) {
            const s = 280 / mag;
            e.xv *= s;
            e.yv *= s;
          }
          e.xv *= 0.916;
          e.yv *= 0.916;
        }
      }

      // 5. Exact Return Spring to (ox, oy) from 044nib_tuote3.js
      // Because (ox, oy) was updated to the NEXT text while you were mixing,
      // the swirling sand naturally settles into the new text as the fluid calms down!
      for (let i = 0; i < au.length; i++) {
        const a = au[i];
        const s = Math.hypot(a.xv, a.yv);
        if (s > 0.5) {
          a.returnStartAt = null;
        } else if (a.returnStartAt === null) {
          a.returnStartAt = simT;
        }
        if (a.returnStartAt !== null) {
          const n = Math.min(1, (simT - a.returnStartAt) / 0.05);
          const smooth = n * n * (3 - 2 * n);
          const pull = 93.75 * PHYSICS_STEP * (0.15 + 0.85 * smooth);
          a.xv += (a.ox - a.x) * pull;
          a.yv += (a.oy - a.y) * pull;
        }
      }

      // 6. Exact Particle Advection from 044nib_tuote3.js
      for (let i = 0; i < au.length; i++) {
        const s = au[i];
        const clampedX = Math.min(Math.max(s.x, 0), viewWidth);
        const clampedY = Math.min(Math.max(s.y, 0), viewHeight);
        const colIdx = Math.min(numCols - 1, Math.max(0, (clampedX / 10) | 0));
        const rowIdx = Math.min(numRows - 1, Math.max(0, (clampedY / 10) | 0));
        const cell = af[colIdx][rowIdx];
        const dx = ((s.x % 10) + 10) % 10 / 10;
        const dy = ((s.y % 10) + 10) % 10 / 10;
        const rightCell = cell.right || cell;
        const downCell = cell.down || cell;

        s.xv += (1 - dx) * cell.xv * 0.09;
        s.yv += (1 - dy) * cell.yv * 0.09;
        s.xv += dx * rightCell.xv * 0.09;
        s.yv += dx * rightCell.yv * 0.09;
        s.xv += dy * downCell.xv * 0.09;
        s.yv += dy * downCell.yv * 0.09;

        const spd = Math.hypot(s.xv, s.yv);
        const maxSpd = s.returnStartAt !== null ? 56.25 : 135;
        if (spd > maxSpd) {
          const sc = maxSpd / (spd || 1);
          s.xv *= sc;
          s.yv *= sc;
        }

        s.x += s.xv;
        s.y += s.yv;
        posArray[3 * i] = s.x;
        posArray[3 * i + 1] = s.y;
        s.xv *= 0.4;
        s.yv *= 0.4;
      }
      }
      // If the frame was so long that the step cap was hit, drop the backlog instead of
      // spiralling (the sim simply runs slower on very slow frames rather than diverging).
      if (physicsSteps >= MAX_PHYSICS_STEPS && physicsAcc > PHYSICS_STEP * 0.5) {
        physicsAcc = 0;
      }
      if (physicsSteps > 0) {
        geometry.attributes.position.needsUpdate = true;
      }

      aV.px = aV.x;
      aV.py = aV.y;

      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }

    let pointerDownPos = null;

    // Pointer listeners: NO scroll, ONLY mixing (Sujata) + click/tap on stage cards!
    overlay.addEventListener('mousedown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    overlay.addEventListener('mouseup', (e) => {
      if (!pointerDownPos) return;
      const move = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
      pointerDownPos = null;
      if (move < 10 && performance.now() - lastStageSwitchAt > 900) {
        const hit = getHitButton(e.clientX, e.clientY);
        if (hit) window.location.href = hit.url;
      }
    });

    overlay.addEventListener('mousemove', (e) => {
      if (aV.x === -9999) {
        aV.px = e.clientX;
        aV.py = e.clientY;
      } else {
        aV.px = aV.x;
        aV.py = aV.y;
      }
      aV.x = e.clientX;
      aV.y = e.clientY;
      aG.targetX = (e.clientX / viewWidth - 0.5) * 2;
      aG.targetY = (e.clientY / viewHeight - 0.5) * 2;
      overlay.style.cursor = getHitButton(e.clientX, e.clientY) ? 'pointer' : 'crosshair';
    });

    overlay.addEventListener('mouseleave', () => {
      pointerDownPos = null;
      aV.x = aV.px = -9999;
      aV.y = aV.py = -9999;
      aG.targetX = 0;
      aG.targetY = 0;
      mixDistanceAccum = 0;
      hasSwitchedForCurrentMix = false;
    });

    overlay.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      pointerDownPos = { x: touch.clientX, y: touch.clientY };
      aV.x = aV.px = touch.clientX;
      aV.y = aV.py = touch.clientY;
      mixDistanceAccum = 0;
      hasSwitchedForCurrentMix = false;
    }, { passive: false });

    overlay.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      aV.px = aV.x;
      aV.py = aV.y;
      aV.x = touch.clientX;
      aV.y = touch.clientY;
    }, { passive: false });

    overlay.addEventListener('touchend', (e) => {
      const touch = e.changedTouches && e.changedTouches[0];
      if (pointerDownPos && touch) {
        const move = Math.hypot(touch.clientX - pointerDownPos.x, touch.clientY - pointerDownPos.y);
        if (move < 12 && performance.now() - lastStageSwitchAt > 900) {
          const hit = getHitButton(touch.clientX, touch.clientY);
          if (hit) {
            window.location.href = hit.url;
            return;
          }
        }
      }
      pointerDownPos = null;
      aV.x = aV.px = -9999;
      aV.y = aV.py = -9999;
      mixDistanceAccum = 0;
      hasSwitchedForCurrentMix = false;
    });

    let resizeTimeout = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        viewWidth = window.innerWidth;
        viewHeight = window.innerHeight;
        renderer.setSize(viewWidth, viewHeight, false);
        const v = viewHeight;
        camera.fov = 2 * Math.atan((viewHeight / 2) / v) * (180 / Math.PI);
        camera.aspect = viewWidth / viewHeight;
        camera.position.set(viewWidth / 2, viewHeight / 2, v);
        camera.lookAt(viewWidth / 2, viewHeight / 2, 0);
        camera.updateProjectionMatrix();
        initFluidGrid();
        precomputeAllStages();
        const targetPts = precomputedStageTargets[currentStage];
        const tLen = targetPts.length;
        for (let i = 0; i < au.length; i++) {
          const pt = targetPts[Math.floor((i * tLen) / au.length)];
          au[i].ox = au[i].x = pt.x;
          au[i].oy = au[i].y = pt.y;
          posArray[3 * i] = au[i].x;
          posArray[3 * i + 1] = au[i].y;
        }
        geometry.attributes.position.needsUpdate = true;
      }, 200);
    });

    document.fonts.ready.then(() => {
      initThreeEngine();
      const stageParam = parseInt(new URLSearchParams(window.location.search).get('stage'), 10);
      if (stageParam >= 1 && stageParam <= STAGES.length) {
        currentStage = stageParam - 1;
        const targetPts = precomputedStageTargets[currentStage];
        const tLen = targetPts.length;
        for (let i = 0; i < au.length; i++) {
          const pt = targetPts[Math.floor((i * tLen) / au.length)];
          au[i].ox = au[i].x = pt.x + (Math.random() - 0.5) * 0.9;
          au[i].oy = au[i].y = pt.y + (Math.random() - 0.5) * 0.9;
          posArray[3 * i] = au[i].x;
          posArray[3 * i + 1] = au[i].y;
        }
        geometry.attributes.position.needsUpdate = true;
        assignStageColors(currentStage, true);
      }
      updateStageUI(currentStage);
      requestAnimationFrame(renderLoop);
    });
  </script>
</body>
</html>
