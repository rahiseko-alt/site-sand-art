<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>03 RITUALS — 3つの抽出儀式 | SUNAGA GURUGURU</title>
  <style>
    @font-face { font-family: 'SF Pro'; src: url('./font/SF-Pro-Subset.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0b0d; color: #f5f5f5; font-family: 'SF Pro', -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 68px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
    .back { color: #f5f5f5; text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.24); border-radius: 999px; background: rgba(10,11,13,0.7); backdrop-filter: blur(8px); }
    .back:hover { background: rgba(255,255,255,0.12); }
    .nav { display: flex; gap: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
    .nav a { color: rgba(255,255,255,0.55); text-decoration: none; }
    .nav a.active, .nav a:hover { color: #ffffff; }
    .center-info { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; z-index: 5; }
    .center-info .step-num { font-size: 12px; letter-spacing: 0.24em; opacity: 0.65; margin-bottom: 8px; }
    .center-info h1 { font-size: 40px; font-weight: 900; letter-spacing: 0.08em; margin-bottom: 10px; }
    .center-info p { font-size: 13px; opacity: 0.78; max-width: 260px; line-height: 1.6; }
    .steps { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; }
    .step-btn { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.24); border-radius: 999px; padding: 10px 18px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; cursor: pointer; transition: all 0.25s; }
    .step-btn.active { background: #fff; color: #0a0b0d; border-color: #fff; }
  </style>
</head>
<body>
  <canvas id="ring"></canvas>
  <header>
    <a class="back" href="./index.html?stage=5">← BACK</a>
    <nav class="nav">
      <a href="./coffee.html">01 COFFEE</a>
      <a href="./culture.html">02 CULTURE</a>
      <a class="active" href="./rituals.html">03 RITUALS</a>
      <a href="./mix.html">MIX</a>
    </nav>
  </header>
  <div class="center-info">
    <div class="step-num" id="stepNum">STEP 01</div>
    <h1 id="stepTitle">STIR</h1>
    <p id="stepDesc">粉とお湯が出会う瞬間。ゆっくりと大きく混ぜて、香りを解き放つ。</p>
  </div>
  <div class="steps">
    <button class="step-btn active" data-step="0">01 STIR</button>
    <button class="step-btn" data-step="1">02 BLOOM</button>
    <button class="step-btn" data-step="2">03 POUR</button>
  </div>
  <script>
    const STEPS = [
      { num: 'STEP 01', title: 'STIR', desc: '粉とお湯が出会う瞬間。ゆっくりと大きく混ぜて、香りを解き放つ。', speed: 0.018, radius: 0.28, jitter: 16, color: '#f5e6d3' },
      { num: 'STEP 02', title: 'BLOOM', desc: 'ガスが抜けて膨らむ静寂の30秒。砂の粒が呼吸するように広がる。', speed: 0.006, radius: 0.34, jitter: 6, color: '#d4a373' },
      { num: 'STEP 03', title: 'POUR', desc: '中心へ細く注ぎきり、澄んだ一杯へ収束させる。', speed: 0.032, radius: 0.22, jitter: 28, color: '#ffffff' }
    ];
    let current = 0;
    const canvas = document.getElementById('ring');
    const ctx = canvas.getContext('2d');
    const N = 1400;
    const pts = Array.from({ length: N }, (_, i) => ({
      angle: (i / N) * Math.PI * 2,
      offset: (Math.random() - 0.5) * 2,
      phase: Math.random() * Math.PI * 2,
      rCur: 160
    }));

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    document.querySelectorAll('.step-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        current = Number(btn.dataset.step);
        document.querySelectorAll('.step-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const st = STEPS[current];
        document.getElementById('stepNum').textContent = st.num;
        document.getElementById('stepTitle').textContent = st.title;
        document.getElementById('stepDesc').textContent = st.desc;
      });
    });

    function loop() {
      const st = STEPS[current];
      ctx.fillStyle = 'rgba(10,11,13,0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const baseR = Math.min(canvas.width, canvas.height) * st.radius;
      const t = performance.now() * 0.002;
      ctx.fillStyle = st.color;
      for (let i = 0; i < N; i++) {
        const p = pts[i];
        p.angle += st.speed * (0.8 + 0.4 * Math.sin(p.phase));
        const targetR = baseR + p.offset * st.jitter + Math.sin(t + p.angle * 3) * (st.jitter * 0.6);
        p.rCur += (targetR - p.rCur) * 0.08;
        const x = cx + Math.cos(p.angle) * p.rCur;
        const y = cy + Math.sin(p.angle) * p.rCur;
        ctx.fillRect(x, y, 2, 2);
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
